<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>德文 Perfekt 複習</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #22263a;
      --border: #2e334d;
      --text: #e8eaf6;
      --muted: #7b82a8;
      --accent: #7c83f5;
      --accent2: #5ed3b0;
      --red: #f56565;
      --yellow: #f6c90e;
      --green: #5ed3b0;
      --haben: #7c83f5;
      --sein: #f09a5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* Mode tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: var(--surface);
      border-radius: 12px;
      padding: 4px;
    }

    .tab {
      padding: 7px 18px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      transition: all .2s;
    }

    .tab.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 1px 4px #0004;
    }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stat span {
      color: var(--text);
      font-weight: 600;
    }

    /* ── FLASHCARD ── */
    #flashcard-mode {
      width: 100%;
      max-width: 540px;
    }

    .card-wrap {
      perspective: 900px;
      width: 100%;
      height: 200px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.4, 0, .2, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 10px;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .card-label {
      font-size: 0.72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .infinitiv-text {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .meaning-text {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .perfekt-text {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
    }

    .haben-color {
      color: var(--haben);
    }

    .sein-color {
      color: var(--sein);
    }

    .aux-badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .08em;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .aux-haben {
      background: #2a2f52;
      color: var(--haben);
    }

    .aux-sein {
      background: #3a2a1a;
      color: var(--sein);
    }

    .example-card {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      max-width: 90%;
      line-height: 1.6;
      font-style: italic;
    }

    .hint-tap {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }

    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-weight: 600;
      border-radius: 10px;
      transition: filter .15s, transform .1s;
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn:active {
      transform: scale(.96);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--muted);
      padding: 10px 20px;
      font-size: 0.88rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 10px 28px;
      font-size: 0.88rem;
    }

    .feedback-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-wrong {
      background: #2e1a1a;
      color: var(--red);
      padding: 10px 28px;
      font-size: 0.88rem;
    }

    .btn-right {
      background: #1a2e26;
      color: var(--green);
      padding: 10px 28px;
      font-size: 0.88rem;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .3s;
    }

    /* ── QUIZ ── */
    #quiz-mode {
      width: 100%;
      max-width: 540px;
      display: none;
    }

    .quiz-question {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 16px;
    }

    .quiz-q-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .quiz-infinitiv {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .quiz-meaning {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .opt-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all .18s;
      text-align: center;
      line-height: 1.4;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .opt-btn.correct {
      background: #1a2e26;
      border-color: var(--green);
      color: var(--green);
    }

    .opt-btn.wrong {
      background: #2e1a1a;
      border-color: var(--red);
      color: var(--red);
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .quiz-next {
      display: flex;
      justify-content: center;
    }

    /* ── LIST ── */
    #list-mode {
      width: 100%;
      max-width: 700px;
      display: none;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all .15s;
    }

    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #1a1f3a;
    }

    .verb-table {
      width: 100%;
      border-collapse: collapse;
    }

    .verb-table th {
      text-align: left;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .verb-table td {
      padding: 11px 10px;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .verb-table tr:hover td {
      background: var(--surface);
    }

    .tag-haben {
      background: #2a2f52;
      color: var(--haben);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .tag-sein {
      background: #3a2a1a;
      color: var(--sein);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .perfekt-cell {
      font-weight: 600;
    }

    .muted-cell {
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>

<body>

  <h1>Perfekt 現在完成式</h1>
  <p class="subtitle">39 個強變化動詞 · 考前複習</p>

  <div class="tabs">
    <button class="tab active" onclick="switchMode('flashcard')">🃏 字卡</button>
    <button class="tab" onclick="switchMode('quiz')">🧪 測驗</button>
    <button class="tab" onclick="switchMode('list')">📋 總覽</button>
  </div>

  <div class="stats">
    <div>進度 <span id="stat-progress">0/39</span></div>
    <div>✅ 答對 <span id="stat-right">0</span></div>
    <div>❌ 答錯 <span id="stat-wrong">0</span></div>
  </div>

  <!-- FLASHCARD MODE -->
  <div id="flashcard-mode">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="card-wrap" onclick="flipCard()">
      <div class="card" id="main-card">
        <div class="card-face card-front">
          <div class="card-label">Infinitiv</div>
          <div class="infinitiv-text" id="fc-infinitiv">—</div>
          <div class="meaning-text" id="fc-meaning">—</div>
          <div class="hint-tap" style="margin-top:12px">點擊翻面 →</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Perfekt</div>
          <div class="perfekt-text" id="fc-perfekt">—</div>
          <div class="aux-badge" id="fc-badge">haben</div>
          <div class="example-card" id="fc-example">—</div>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="prevCard()">← 上一張</button>
      <button class="btn btn-ghost" onclick="shuffleCards()">🔀 亂序</button>
      <button class="btn btn-ghost" onclick="nextCard()">下一張 →</button>
    </div>
    <div id="feedback-row" style="display:none" class="feedback-row">
      <button class="btn btn-wrong" onclick="markWrong()">❌ 不熟</button>
      <button class="btn btn-right" onclick="markRight()">✅ 記住了</button>
    </div>
  </div>

  <!-- QUIZ MODE -->
  <div id="quiz-mode">
    <div class="progress-bar">
      <div class="progress-fill" id="quiz-progress-fill" style="width:0%"></div>
    </div>
    <div class="quiz-question">
      <div class="quiz-q-label">這個動詞的 Perfekt 是？</div>
      <div class="quiz-infinitiv" id="q-infinitiv">—</div>
      <div class="quiz-meaning" id="q-meaning">—</div>
    </div>
    <div class="quiz-options" id="quiz-options"></div>
    <div class="quiz-next">
      <button class="btn btn-primary" id="quiz-next-btn" onclick="nextQuiz()" style="display:none">下一題 →</button>
    </div>
    <div style="text-align:center;margin-top:16px">
      <button class="btn btn-ghost" onclick="restartQuiz()">↺ 重新開始</button>
    </div>
  </div>

  <!-- LIST MODE -->
  <div id="list-mode">
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterList('all', this)">全部</button>
      <button class="filter-btn" onclick="filterList('haben', this)">haben</button>
      <button class="filter-btn" onclick="filterList('sein', this)">sein</button>
      <button class="filter-btn" onclick="filterList('both', this)">haben / sein</button>
    </div>
    <table class="verb-table">
      <thead>
        <tr>
          <th>Infinitiv</th>
          <th>Perfekt</th>
          <th>助動詞</th>
          <th>中文</th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>

  <script>
    const VERBS = [
      { inf: "sein", perfekt: "ist gewesen", aux: "sein", meaning: "是，有", example: "Ich bin im Urlaub in Deutschland gewesen." },
      { inf: "haben", perfekt: "hat gehabt", aux: "haben", meaning: "擁有", example: "Wir haben gestern viel Glück gehabt." },
      { inf: "lesen", perfekt: "hat gelesen", aux: "haben", meaning: "閱讀", example: "Ich habe die Zeitung schon gelesen." },
      { inf: "sehen", perfekt: "hat gesehen", aux: "haben", meaning: "看", example: "Wir haben gestern einen Film gesehen." },
      { inf: "schlafen", perfekt: "hat geschlafen", aux: "haben", meaning: "睡覺", example: "Ich habe letzte Nacht sehr gut geschlafen." },
      { inf: "tragen", perfekt: "hat getragen", aux: "haben", meaning: "搬／穿／戴", example: "Ich habe die schwere Tasche getragen." },
      { inf: "schreiben", perfekt: "hat geschrieben", aux: "haben", meaning: "寫", example: "Er hat mir eine lange E-Mail geschrieben." },
      { inf: "laden", perfekt: "hat geladen", aux: "haben", meaning: "充電；裝貨；邀請", example: "Ich habe den Akku geladen." },
      { inf: "essen", perfekt: "hat gegessen", aux: "haben", meaning: "吃", example: "Was habt ihr zu Mittag gegessen?" },
      { inf: "trinken", perfekt: "hat getrunken", aux: "haben", meaning: "喝", example: "Wir haben zusammen einen Tee getrunken." },
      { inf: "rufen", perfekt: "hat gerufen", aux: "haben", meaning: "叫來；呼喊", example: "Ich habe dich gestern Abend angerufen." },
      { inf: "stehen", perfekt: "hat gestanden", aux: "haben", meaning: "站立；位於", example: "Das Auto hat vor der Garage gestanden." },
      { inf: "unterschreiben", perfekt: "hat unterschrieben", aux: "haben", meaning: "簽名", example: "Hast du das Dokument schon unterschrieben?" },
      { inf: "finden", perfekt: "hat gefunden", aux: "haben", meaning: "找到；認為", example: "Ich habe meinen Schlüssel endlich gefunden." },
      { inf: "geben", perfekt: "hat gegeben", aux: "haben", meaning: "給", example: "Der Lehrer hat uns keine Hausaufgaben gegeben." },
      { inf: "bringen", perfekt: "hat gebracht", aux: "haben", meaning: "送來／送去", example: "Der Postbote hat mir ein Paket gebracht." },
      { inf: "mitbringen", perfekt: "hat mitgebracht", aux: "haben", meaning: "帶來", example: "Meine Freundin hat Kuchen mitgebracht." },
      { inf: "bekommen", perfekt: "hat bekommen", aux: "haben", meaning: "得到；收到", example: "Hast du meine E-Mail bekommen?" },
      { inf: "sprechen", perfekt: "hat gesprochen", aux: "haben", meaning: "說；說話", example: "Wir haben lange über das Projekt gesprochen." },
      { inf: "nehmen", perfekt: "hat genommen", aux: "haben", meaning: "拿；搭乘；服藥", example: "Wer hat meinen Kugelschreiber genommen?" },
      { inf: "fangen", perfekt: "hat gefangen", aux: "haben", meaning: "捕捉；吸引", example: "Die Katze hat einen Vogel gefangen." },
      { inf: "helfen", perfekt: "hat geholfen", aux: "haben", meaning: "幫助", example: "Das Medikament hat mir sehr geholfen." },
      { inf: "beginnen", perfekt: "hat begonnen", aux: "haben", meaning: "開始", example: "Der Kurs hat um 9 Uhr begonnen." },
      { inf: "können", perfekt: "hat gekonnt", aux: "haben", meaning: "能夠；會；可以", example: "Er hat das gut gekonnt." },
      { inf: "wollen", perfekt: "hat gewollt", aux: "haben", meaning: "要；想要", example: "Ich habe das nicht gewollt." },
      { inf: "waschen", perfekt: "hat gewaschen", aux: "haben", meaning: "洗", example: "Er hat das Auto gewaschen." },
      { inf: "backen", perfekt: "hat gebacken", aux: "haben", meaning: "烘焙", example: "Meine Mutter hat eine Pizza gebacken." },
      { inf: "schließen", perfekt: "hat geschlossen", aux: "haben", meaning: "關上；締結", example: "Er hat die Tür geschlossen." },
      { inf: "schneiden", perfekt: "hat geschnitten", aux: "haben", meaning: "切；剪", example: "Sie hat das Gemüse geschnitten." },
      { inf: "kommen", perfekt: "ist gekommen", aux: "sein", meaning: "來；到來", example: "Der Bus ist pünktlich gekommen." },
      { inf: "ankommen", perfekt: "ist angekommen", aux: "sein", meaning: "到達", example: "Mein Paket ist heute angekommen." },
      { inf: "gehen", perfekt: "ist gegangen", aux: "sein", meaning: "去；離開；步行", example: "Sie ist schon nach Hause gegangen." },
      { inf: "ziehen", perfekt: "ist/hat gezogen", aux: "both", meaning: "搬家(ist)；拉扯(hat)", example: "Er ist nach Deutschland gezogen." },
      { inf: "umziehen", perfekt: "ist umgezogen", aux: "sein", meaning: "搬家", example: "Meine Freundin ist gestern umgezogen." },
      { inf: "bleiben", perfekt: "ist geblieben", aux: "sein", meaning: "停留；保持", example: "Am Sonntag bin ich zu Hause geblieben." },
      { inf: "fallen", perfekt: "ist gefallen", aux: "sein", meaning: "掉落；墜落", example: "Ich bin vom Fahrrad gefallen." },
      { inf: "fernsehen", perfekt: "hat ferngesehen", aux: "haben", meaning: "看電視", example: "Hast du gestern ferngesehen?" },
      { inf: "schwimmen", perfekt: "ist geschwommen", aux: "sein", meaning: "游泳", example: "Er ist im See geschwommen." },
      { inf: "laufen", perfekt: "ist gelaufen", aux: "sein", meaning: "跑；走", example: "Sie ist jeden Morgen gelaufen." },
    ];

    // State
    let deck = [...VERBS];
    let cardIndex = 0;
    let isFlipped = false;
    let rightCount = 0, wrongCount = 0, seenCount = 0;

    // Quiz state
    let quizDeck = [], quizIndex = 0, quizRight = 0, quizWrong = 0;

    // ── FLASHCARD ──
    function loadCard() {
      const v = deck[cardIndex];
      document.getElementById('fc-infinitiv').textContent = v.inf;
      document.getElementById('fc-meaning').textContent = v.meaning;
      const p = document.getElementById('fc-perfekt');
      p.innerHTML = v.aux === 'sein'
        ? `<span class="sein-color">${v.perfekt}</span>`
        : v.aux === 'both'
          ? `<span class="haben-color">${v.perfekt}</span>`
          : `<span class="haben-color">${v.perfekt}</span>`;
      const badge = document.getElementById('fc-badge');
      badge.textContent = v.aux === 'both' ? 'haben / sein' : v.aux;
      badge.className = 'aux-badge ' + (v.aux === 'sein' ? 'aux-sein' : 'aux-haben');
      document.getElementById('fc-example').textContent = v.example;

      const card = document.getElementById('main-card');
      card.classList.remove('flipped');
      isFlipped = false;
      document.getElementById('feedback-row').style.display = 'none';

      const fill = ((cardIndex + 1) / deck.length * 100).toFixed(0);
      document.getElementById('progress-fill').style.width = fill + '%';
      document.getElementById('stat-progress').textContent = `${cardIndex + 1}/${deck.length}`;
    }

    function flipCard() {
      const card = document.getElementById('main-card');
      isFlipped = !isFlipped;
      card.classList.toggle('flipped', isFlipped);
      if (isFlipped) {
        seenCount++;
        document.getElementById('feedback-row').style.display = 'flex';
      }
    }

    function nextCard() {
      if (cardIndex < deck.length - 1) { cardIndex++; loadCard(); }
    }
    function prevCard() {
      if (cardIndex > 0) { cardIndex--; loadCard(); }
    }
    function shuffleCards() {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      cardIndex = 0; loadCard();
    }
    function markRight() {
      rightCount++;
      document.getElementById('stat-right').textContent = rightCount;
      nextCard();
    }
    function markWrong() {
      wrongCount++;
      document.getElementById('stat-wrong').textContent = wrongCount;
      // Put this card at the end to review again
      const v = deck.splice(cardIndex, 1)[0];
      deck.push(v);
      if (cardIndex >= deck.length) cardIndex = 0;
      loadCard();
    }

    // ── QUIZ ──
    function startQuiz() {
      quizDeck = [...VERBS].sort(() => Math.random() - 0.5);
      quizIndex = 0; quizRight = 0; quizWrong = 0;
      loadQuiz();
    }
    function loadQuiz() {
      if (quizIndex >= quizDeck.length) { showQuizResult(); return; }
      const v = quizDeck[quizIndex];
      document.getElementById('q-infinitiv').textContent = v.inf;
      document.getElementById('q-meaning').textContent = v.meaning;
      document.getElementById('quiz-progress-fill').style.width = (quizIndex / quizDeck.length * 100) + '%';
      document.getElementById('quiz-next-btn').style.display = 'none';

      // Build 4 options: 1 correct + 3 random wrong
      const others = VERBS.filter(x => x.inf !== v.inf).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [...others, v].sort(() => Math.random() - 0.5);
      const container = document.getElementById('quiz-options');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<strong>${opt.perfekt}</strong>`;
        btn.onclick = () => answerQuiz(btn, opt, v);
        container.appendChild(btn);
      });
    }
    function answerQuiz(btn, chosen, correct) {
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      if (chosen.inf === correct.inf) {
        btn.classList.add('correct'); quizRight++;
        document.getElementById('stat-right').textContent = rightCount + quizRight;
      } else {
        btn.classList.add('wrong'); quizWrong++;
        document.getElementById('stat-wrong').textContent = wrongCount + quizWrong;
        // Show correct answer
        document.querySelectorAll('.opt-btn').forEach(b => {
          if (b.innerHTML.includes(correct.perfekt)) b.classList.add('correct');
        });
      }
      document.getElementById('quiz-next-btn').style.display = 'inline-block';
    }
    function nextQuiz() { quizIndex++; loadQuiz(); }
    function restartQuiz() { startQuiz(); }
    function showQuizResult() {
      const total = quizDeck.length;
      document.querySelector('.quiz-question').innerHTML = `
    <div style="padding:12px 0">
      <div style="font-size:2.5rem;margin-bottom:12px">🎉</div>
      <div style="font-size:1.2rem;font-weight:700;margin-bottom:8px">完成！</div>
      <div style="color:var(--muted);font-size:0.9rem">答對 <strong style="color:var(--green)">${quizRight}</strong> / ${total}　答錯 <strong style="color:var(--red)">${quizWrong}</strong></div>
    </div>`;
      document.getElementById('quiz-options').innerHTML = '';
      document.getElementById('quiz-next-btn').style.display = 'none';
    }

    // ── LIST ──
    let listFilter = 'all';
    function renderList() {
      const body = document.getElementById('list-body');
      const filtered = VERBS.filter(v => {
        if (listFilter === 'all') return true;
        if (listFilter === 'both') return v.aux === 'both';
        return v.aux === listFilter;
      });
      body.innerHTML = filtered.map(v => `
    <tr>
      <td><strong>${v.inf}</strong></td>
      <td class="perfekt-cell ${v.aux === 'sein' ? 'sein-color' : 'haben-color'}">${v.perfekt}</td>
      <td><span class="tag-${v.aux === 'both' ? 'sein' : v.aux}">${v.aux}</span></td>
      <td class="muted-cell">${v.meaning}</td>
    </tr>`).join('');
    }
    function filterList(f, btn) {
      listFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    // ── MODE SWITCH ──
    function switchMode(mode) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['flashcard', 'quiz', 'list'][i] === mode);
      });
      document.getElementById('flashcard-mode').style.display = mode === 'flashcard' ? '' : 'none';
      document.getElementById('quiz-mode').style.display = mode === 'quiz' ? '' : 'none';
      document.getElementById('list-mode').style.display = mode === 'list' ? '' : 'none';
      if (mode === 'quiz') startQuiz();
      if (mode === 'list') renderList();
    }

    // Init
    loadCard();
  </script>
</body>

</html>
