<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoGerman - 德文單字特訓</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu-screen" class="screen active">
        <div class="menu-content">
            <h1>Willkommen!</h1>
            <div class="mode-toggle">
                <button id="mode-quiz" class="mode-btn active" onclick="setMode('quiz')">選擇題</button>
                <button id="mode-dictation" class="mode-btn" onclick="setMode('dictation')">🎧 聽寫</button>
            </div>
            <div id="speech-debug" class="speech-debug">
                <div id="speech-debug-info">檢查語音功能中...</div>
                <button class="replay-btn" style="padding:12px; font-size:1rem; margin:8px 0 4px;"
                    onclick="testSpeech()">🔊 測試發音（Hallo!）</button>
                <div id="speech-debug-status"></div>
                <small style="color:#999;">📱 iPhone 請確認側邊「靜音開關」未開啟，且媒體音量已開大</small>
            </div>
            <p>請選擇單詞本開始練習：</p>
            <div id="vocab-list" class="vocab-list"></div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="header">
            <div style="cursor:pointer; font-size: 1.5rem;" onclick="showMenu()">❮</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <div class="game-area" id="game-area"></div>
    </div>

    <div id="result-screen" class="screen">
        <div class="menu-content">
            <h1>練習結束！</h1>
            <div id="result-summary"></div>
            <div id="wrong-answers-display" class="wrong-list"></div>
            <button class="vocab-item"
                style="width: 100%; margin-top: 20px; background: var(--duo-blue); color: white; border: none;"
                onclick="showMenu()">返回選單</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <div class="header">
            <div style="cursor:pointer; font-size: 1.5rem;" onclick="showMenu()">❮</div>
            <h2 id="list-title" style="flex-grow:1; text-align:center; margin:0; font-size:1rem;"></h2>
            <button id="edit-toggle-btn" class="list-edit-btn" onclick="toggleEditMode()">✏️ 編輯</button>
        </div>
        <div id="list-content" class="list-content"></div>
        <div id="list-footer" class="list-footer">
            <button id="reset-btn" class="list-reset-btn" onclick="resetToOriginal()" style="display:none;">↺ 重置</button>
            <button class="list-download-btn" onclick="downloadVocab()">下載 .txt</button>
        </div>
    </div>

    <div class="bottom-sheet" id="bottom-sheet">
        <div id="feedback-msg" style="font-weight:bold; font-size:1.2rem;"></div>
        <div id="feedback-detail" style="margin: 5px 0 15px 0;"></div>
        <button class="next-btn" onclick="nextQuestion()">繼續</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
