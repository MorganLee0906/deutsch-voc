<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoGerman - 德文單字特訓</title>
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-dark: #46a302;
            --duo-red: #ff4b4b;
            --duo-red-dark: #d42a2a;
            --duo-blue: #1cb0f6;
            --duo-blue-dark: #1480b3;
            --duo-gray: #e5e5e5;
            --duo-text: #4b4b4b;
            --bg: #fff;
        }

        body {
            font-family: "Nunito", "Segoe UI", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            color: var(--duo-text);
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            height: 100%;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        .menu-content {
            padding: 40px 20px;
            text-align: center;
            overflow-y: auto;
        }

        .vocab-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .vocab-item {
            padding: 20px;
            border: 2px solid var(--duo-gray);
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .vocab-item:hover {
            background-color: #f7f7f7;
            border-color: var(--duo-blue);
        }

        .wrong-list {
            text-align: left;
            background: #fff1f1;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid #ffdfe0;
        }

        .wrong-item {
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
        }

        .progress-container {
            flex-grow: 1;
            height: 16px;
            background-color: var(--duo-gray);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--duo-green);
            width: 0%;
            transition: width 0.5s ease;
        }

        .game-area {
            flex-grow: 1;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 100px;
        }

        .word-display {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #e5e5e5;
            padding: 20px;
            border-radius: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 400px) {
            .options-grid.articles {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid var(--duo-gray);
            border-bottom-width: 4px;
            border-radius: 15px;
            padding: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            border-style: solid;
        }

        .option-btn.correct {
            background-color: #d7ffb8;
            border-color: var(--duo-green);
            color: var(--duo-green-dark);
        }

        .option-btn.wrong {
            background-color: #ffdfe0;
            border-color: var(--duo-red);
            color: var(--duo-red-dark);
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 10;
            border-radius: 20px 20px 0 0;
        }

        .bottom-sheet.show {
            transform: translateY(0);
        }

        .bottom-sheet.correct {
            background-color: #d7ffb8;
            color: var(--duo-green-dark);
        }

        .bottom-sheet.wrong {
            background-color: #ffdfe0;
            color: var(--duo-red-dark);
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-top: 10px;
        }

        .bottom-sheet.correct .next-btn {
            background-color: var(--duo-green);
        }

        .bottom-sheet.wrong .next-btn {
            background-color: var(--duo-red);
        }
    </style>
</head>

<body>

    <div id="menu-screen" class="screen active">
        <div class="menu-content">
            <h1>Willkommen!</h1>
            <p>請選擇單詞本開始練習：</p>
            <div id="vocab-list" class="vocab-list"></div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="header">
            <div style="cursor:pointer; font-size: 1.5rem;" onclick="showMenu()">❮</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <div class="game-area" id="game-area"></div>
    </div>

    <div id="result-screen" class="screen">
        <div class="menu-content">
            <h1>練習結束！</h1>
            <div id="result-summary"></div>
            <div id="wrong-answers-display" class="wrong-list"></div>
            <button class="vocab-item"
                style="width: 100%; margin-top: 20px; background: var(--duo-blue); color: white; border: none;"
                onclick="showMenu()">返回選單</button>
        </div>
    </div>

    <div class="bottom-sheet" id="bottom-sheet">
        <div id="feedback-msg" style="font-weight:bold; font-size:1.2rem;"></div>
        <div id="feedback-detail" style="margin: 5px 0 15px 0;"></div>
        <button class="next-btn" onclick="nextQuestion()">繼續</button>
    </div>

    <script>
        let vocabData = [];
        let wrongAnswers = [];
        let currentQIndex = 0;
        let isAnswered = false;

        // --- TTS 語音 ---
        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'de-DE';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        // --- 初始化選單 ---
        async function initMenu() {
            const listContainer = document.getElementById('vocab-list');
            listContainer.innerHTML = "載入中...";
            try {
                const response = await fetch('./voc/list.json');
                if (!response.ok) throw new Error();
                const vocabFiles = await response.json();
                listContainer.innerHTML = "";
                vocabFiles.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'vocab-item';
                    div.textContent = item.name;
                    div.onclick = () => loadVocabFile(item.file);
                    listContainer.appendChild(div);
                });
            } catch (err) {
                listContainer.innerHTML = "無法載入清單。請確認 voc/list.json 格式正確且存在。";
            }
        }

        // --- 讀取單字檔 (支援清理雜訊與 TSV) ---
        async function loadVocabFile(fileName) {
            try {
                const response = await fetch(`./voc/${fileName}`);
                if (!response.ok) throw new Error();
                let text = await response.text();

                // 移除 標記
                text = text.replace(/\/g, '');

                vocabData = text.split('\n')
                    .filter(line => line.trim() !== '')
                    .map(line => {
                        const parts = line.split('\t').map(p => p.trim()).filter(p => p !== '');
                        // 識別名詞 (支援 der, die, das, der/die)
                        const isNoun = parts.length >= 3 && /^(der|die|das|der\/die)$/i.test(parts[0]);

                        if (isNoun) {
                            return { art: parts[0].toLowerCase(), de: parts[1], cn: parts[2], type: 'noun' };
                        } else if (parts.length >= 2) {
                            return { de: parts[0], cn: parts[1], type: 'other' };
                        }
                        return null;
                    }).filter(item => item !== null);

                if (vocabData.length === 0) throw new Error();
                startGame();
            } catch (err) { alert("讀取失敗，請檢查檔案格式！"); }
        }

        function startGame() {
            vocabData.sort(() => Math.random() - 0.5);
            currentQIndex = 0;
            wrongAnswers = [];
            switchScreen('game-screen');
            loadQuestion();
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showMenu() { switchScreen('menu-screen'); }

        function loadQuestion() {
            isAnswered = false;
            document.getElementById('bottom-sheet').classList.remove('show');
            const item = vocabData[currentQIndex];
            speak(item.de);
            document.getElementById('progress-bar').style.width = `${(currentQIndex / vocabData.length) * 100}%`;

            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';
            let qType = (item.type === 'noun' && Math.random() > 0.5) ? 0 : 1;

            const h2 = document.createElement('h2');
            h2.textContent = qType === 0 ? "請選擇正確的冠詞" : "選出正確的意思";
            gameArea.appendChild(h2);

            const wordDisplay = document.createElement('div');
            wordDisplay.className = 'word-display';
            wordDisplay.textContent = item.de;
            gameArea.appendChild(wordDisplay);

            const grid = document.createElement('div');
            grid.className = 'options-grid ' + (qType === 0 ? 'articles' : '');

            if (qType === 0) {
                ['der', 'die', 'das'].forEach(art => grid.appendChild(createOptionBtn(art, art === item.art, item)));
            } else {
                let opts = [{ text: item.cn, correct: true }];
                const distractors = vocabData.filter(v => v.cn !== item.cn);
                distractors.sort(() => Math.random() - 0.5).slice(0, 3).forEach(d => opts.push({ text: d.cn, correct: false }));
                opts.sort(() => Math.random() - 0.5).forEach(o => grid.appendChild(createOptionBtn(o.text, o.correct, item)));
            }
            gameArea.appendChild(grid);
        }

        function createOptionBtn(text, isCorrect, item) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = text;
            btn.onclick = () => {
                if (isAnswered) return;
                isAnswered = true;
                const fullWord = item.art ? `${item.art} ${item.de}` : item.de;
                speak(fullWord);

                const sheet = document.getElementById('bottom-sheet');
                if (isCorrect) {
                    btn.classList.add('correct');
                    sheet.className = 'bottom-sheet show correct';
                    document.getElementById('feedback-msg').textContent = "太棒了！";
                } else {
                    btn.classList.add('wrong');
                    sheet.className = 'bottom-sheet show wrong';
                    document.getElementById('feedback-msg').textContent = "正確答案是：";
                    if (!wrongAnswers.find(w => w.de === item.de)) wrongAnswers.push(item);
                }
                document.getElementById('feedback-detail').textContent = `${item.art ? item.art + ' ' : ''}${item.de} = ${item.cn}`;
            };
            return btn;
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex >= vocabData.length) showResults();
            else loadQuestion();
        }

        function showResults() {
            switchScreen('result-screen');
            const summary = document.getElementById('result-summary');
            const wrongDisplay = document.getElementById('wrong-answers-display');
            summary.innerHTML = `本次練習共 ${vocabData.length} 題，寫錯 ${wrongAnswers.length} 題。`;
            if (wrongAnswers.length > 0) {
                wrongDisplay.style.display = 'block';
                wrongDisplay.innerHTML = "<strong>需複習單字：</strong><br><br>";
                wrongAnswers.forEach(w => {
                    wrongDisplay.innerHTML += `<div class="wrong-item">${w.art ? w.art + ' ' : ''}<strong>${w.de}</strong> : ${w.cn}</div>`;
                });
            } else {
                wrongDisplay.style.display = 'none';
                summary.innerHTML += "<br>🎉 全對！祝你在復旦大學生活順利！";
            }
        }

        initMenu();
    </script>
</body>

</html>
