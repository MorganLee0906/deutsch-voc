<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoGerman - 德文單字特訓</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu-screen" class="screen active">
        <div class="menu-content">
            <h1>Willkommen!</h1>
            <div class="mode-toggle">
                <button id="mode-quiz" class="mode-btn active" onclick="setMode('quiz')">選擇題</button>
                <button id="mode-dictation" class="mode-btn" onclick="setMode('dictation')">🎧 聽寫</button>
            </div>
            <p>請選擇單詞本開始練習：</p>
            <div id="vocab-list" class="vocab-list"></div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="header">
            <div style="cursor:pointer; font-size: 1.5rem;" onclick="showMenu()">❮</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <div class="game-area" id="game-area"></div>
    </div>

    <div id="result-screen" class="screen">
        <div class="menu-content">
            <h1>練習結束！</h1>
            <div id="result-summary"></div>
            <div id="wrong-answers-display" class="wrong-list"></div>
            <button class="vocab-item"
                style="width: 100%; margin-top: 20px; background: var(--duo-blue); color: white; border: none;"
                onclick="showMenu()">返回選單</button>
        </div>
    </div>

    <div class="bottom-sheet" id="bottom-sheet">
        <div id="feedback-msg" style="font-weight:bold; font-size:1.2rem;"></div>
        <div id="feedback-detail" style="margin: 5px 0 15px 0;"></div>
        <button class="next-btn" onclick="nextQuestion()">繼續</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
